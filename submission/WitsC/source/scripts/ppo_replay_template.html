<div id="ppo-game-replay">
  <h3>PPO game replays</h3>
  <label class="form-label">Recorded episode <select class="form-select" data-role="episode"></select></label>
  <div class="viz-controls">
    <label class="form-label">Jump to <select class="form-select" data-role="jump"></select></label>
    <label class="form-label">Click positions <select class="form-select" data-role="grid"><option value="0">Chosen click only</option><option value="8">Current 8 × 8 grid</option><option value="16">Proposed 16 × 16 grid</option></select></label>
  </div>
  <div class="viz-row"><button class="btn" data-role="prev">Previous</button><button class="btn btn-primary" data-role="play">Play</button><button class="btn" data-role="next">Next</button><span data-role="position" class="tabular-nums"></span></div>
  <label class="form-label">Policy decision <input class="form-range" data-role="step" type="range" min="0" value="0" /></label>
  <div class="replay-frames">
    <div><div class="text-small">Before · cross marks chosen click</div><canvas width="320" height="320" data-role="before" role="img" aria-label="Game observation before the selected action"></canvas></div>
    <div><div class="text-small">After · observation returned to PPO</div><canvas width="320" height="320" data-role="after" role="img" aria-label="Game observation after the selected action"></canvas></div>
  </div>
  <div data-role="detail" aria-live="polite"></div>
  <div data-role="state" class="text-small"></div>
  <div data-role="outcome" class="text-small text-muted"></div>
  <div data-role="error" role="alert"></div>
</div>
<style>
#ppo-game-replay .replay-frames {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0;}
#ppo-game-replay canvas {width:100%;height:auto;image-rendering:pixelated;display:block;}
@media(max-width:480px){#ppo-game-replay .replay-frames{grid-template-columns:1fr;}}
</style>
<script>
(async()=>{
const root=document.getElementById('ppo-game-replay');
const el=name=>root.querySelector(`[data-role="${name}"]`);
try {
const bytes=Uint8Array.from(atob('__REPLAY_DATA__'), c=>c.charCodeAt(0));
const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
const data=JSON.parse(await new Response(stream).text());
const palette=data.palette;
const runs=data.runs;
let runIndex=0,index=0,timer=null;
const saved=window.openai?.widgetState;
const initial=saved?.privateContent || {};
function restore(s){if(!s)return;runIndex=Math.max(0,Math.min(runs.length-1,Number(s.run)||0));index=Math.max(0,Math.min(runs[runIndex].steps.length-1,Number(s.index)||0));el('grid').value=['0','8','16'].includes(String(s.grid))?String(s.grid):'0';}
restore(initial);
runs.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.summary.name.replaceAll('_',' ');el('episode').append(o);});
function persist(){window.openai?.setWidgetState({modelContent:{episode:runs[runIndex].summary.name,decision:index+1,clickGrid:el('grid').value},privateContent:{run:runIndex,index,grid:el('grid').value}})?.catch(()=>{});}
function draw(canvas,frameId,xy,overlay){
 const ctx=canvas.getContext('2d');let pixel=0;
 for(const [color,count] of runs[runIndex].frames[frameId]){ctx.fillStyle=palette[color];for(let i=0;i<count;i++,pixel++)ctx.fillRect((pixel%64)*5,Math.floor(pixel/64)*5,5,5);}
 // Official game palette remains fixed; overlays have contrasting outlines for all tile colours.
 const grid=Number(el('grid').value);
 if(overlay&&grid&&runs[runIndex].summary.name.startsWith('ft09')){for(let y=0;y<grid;y++)for(let x=0;x<grid;x++){const px=Math.floor((x+.5)*64/grid)*5+2.5,py=Math.floor((y+.5)*64/grid)*5+2.5;ctx.beginPath();ctx.arc(px,py,2,0,2*Math.PI);ctx.fillStyle=palette[0];ctx.fill();ctx.strokeStyle=palette[5];ctx.lineWidth=1;ctx.stroke();}}
 if(xy){const x=xy[0]*5+2.5,y=xy[1]*5+2.5;for(const [color,width] of [[palette[5],5],[palette[0],2]]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x-7,y-7);ctx.lineTo(x+7,y+7);ctx.moveTo(x-7,y+7);ctx.lineTo(x+7,y-7);ctx.stroke();}}
}
function jumps(){const rows=runs[runIndex].steps;const options=[['Start',0]];const level=rows.findIndex((r,i)=>r.levels>(i?rows[i-1].levels:0));if(level>=0)options.push(['First level completed',level],['First action on next level',Math.min(level+1,rows.length-1)]);const death=rows.findIndex(r=>r.events.some(e=>e.state==='GAME_OVER'));if(death>=0)options.push(['First death and reset',death]);let stall=0;rows.forEach((r,i)=>{if(r.streak>rows[stall].streak)stall=i;});options.push(['Longest unchanged streak',stall],['Last decision',rows.length-1]);el('jump').replaceChildren();for(const [text,value] of options){const o=document.createElement('option');o.value=value;o.textContent=text;el('jump').append(o);}}
function render(){const run=runs[runIndex],s=run.steps[index];el('episode').value=runIndex;el('step').max=run.steps.length-1;el('step').value=index;el('position').textContent=`${index+1} / ${run.steps.length} decisions · ${s.actions_used} actions used`;
if(!el('jump').querySelector('option[value=""]')){const o=document.createElement('option');o.value='';o.textContent='Choose an event';el('jump').prepend(o);}el('jump').value=Array.from(el('jump').options).some(o=>o.value===String(index))?String(index):'';
draw(el('before'),s.before,s.xy,true);draw(el('after'),s.after,null,false);
el('detail').textContent=`${s.label}${s.xy?' ('+s.xy.join(', ')+')':''} · policy probability ${(s.prob*100).toFixed(1)}% · ${s.changed} pixels changed · ${s.levels} levels completed`;
const state=s.state;el('state').textContent=`${state.target?'Target: '+state.target+' · ':''}${state.moves_left!==undefined?'Moves left before action: '+state.moves_left+' · ':''}Unchanged streak: ${s.streak}${s.events.some(e=>e.state==='GAME_OVER')?' · GAME OVER → automatic RESET':''}`;
const summary=run.summary;el('outcome').textContent=`Frozen CUDA policy · sampling seed 100 · episode: ${summary.levels} levels, ${summary.deaths} deaths, ${(summary.no_change_fraction*100).toFixed(1)}% unchanged observations. Grid overlays are diagnostic only.`;
}
function stop(){clearInterval(timer);timer=null;el('play').textContent='Play';}
el('episode').onchange=()=>{stop();runIndex=Number(el('episode').value);index=0;jumps();render();persist();};
el('step').oninput=()=>{stop();index=Number(el('step').value);render();};el('step').onchange=persist;
el('prev').onclick=()=>{stop();index=Math.max(0,index-1);render();persist();};
el('next').onclick=()=>{stop();index=Math.min(runs[runIndex].steps.length-1,index+1);render();persist();};
el('jump').onchange=()=>{if(el('jump').value==='')return;stop();index=Number(el('jump').value);render();persist();};
el('grid').onchange=()=>{render();persist();};
el('play').onclick=()=>{if(timer){stop();persist();return;}el('play').textContent='Pause';timer=setInterval(()=>{if(index>=runs[runIndex].steps.length-1){stop();persist();return;}index++;render();},180);};
window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent;if(s){stop();restore(s);jumps();render();}});
jumps();render();
}catch(error){el('error').textContent='Replay could not load: '+error.message;}
})();
</script>
